# Single broker for the reference deployment. At fleet scale use a clustered broker (EMQX,
# HiveMQ) or AWS IoT Core; the platform services don't change, they only need the hostname.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  labels: { app.kubernetes.io/name: mosquitto }
spec:
  serviceName: mosquitto
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mosquitto } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mosquitto }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1883, fsGroup: 1883, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mosquitto
          image: iot/mosquitto
          ports: [{ name: mqtt, containerPort: 1883 }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe: { tcpSocket: { port: mqtt }, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: data, mountPath: /mosquitto/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-devices
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: mosquitto }
  ports: [{ name: mqtt, port: 1883, targetPort: mqtt }]
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app.kubernetes.io/name: mosquitto }
  ports: [{ name: mqtt, port: 1883, targetPort: mqtt }]
