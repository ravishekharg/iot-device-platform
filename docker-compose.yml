# Local stack: simulated device fleet → MQTT broker / LwM2M server → Kafka → PostgreSQL,
# plus the northbound API and monitoring. Every config file is baked into its image (no bind
# mounts), so the same images run unchanged on Kubernetes.
#
#   docker compose up -d --build
#   API http://localhost:8096/docs · Grafana http://localhost:3001 · Leshan UI http://localhost:8097
name: iot

x-python-service: &python-service
  restart: unless-stopped
  environment: &common-env
    KAFKA_BOOTSTRAP: kafka:9092
    MQTT_HOST: mosquitto
    LESHAN_API: http://leshan:8080/api
    DATABASE_URL: postgresql://iot:iot-local-only@postgres:5432/iot

services:
  mosquitto:
    build: infra/mosquitto
    restart: unless-stopped
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # one socket per connected device
    ports: ["1883:1883"]
    volumes: [mosquitto-data:/mosquitto/data]

  leshan:
    build: leshan
    restart: unless-stopped
    ports: ["5683:5683/udp", "8097:8080"]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # KRaft: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6                          # parallelism for consumer groups
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12
    volumes: [kafka-data:/var/lib/kafka/data]

  postgres:
    build: infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot-local-only
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  ingest:
    <<: *python-service
    build: services/ingest
    deploy: { replicas: 2 }        # two replicas share the subscription ($share/ingest/...)
    depends_on:
      kafka: { condition: service_healthy }
      mosquitto: { condition: service_started }

  lwm2m-bridge:
    <<: *python-service
    build: services/lwm2m-bridge
    depends_on:
      kafka: { condition: service_healthy }
      leshan: { condition: service_started }

  writer:
    <<: *python-service
    build: services/writer
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  api:
    <<: *python-service
    build: services/api
    ports: ["8096:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  simulator:
    <<: *python-service
    build: services/simulator
    ports: ["9101:9100"]          # scripts/reconnect-storm.sh samples these metrics every second
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # the default 1024 stopped the fleet at ~1015 devices
    environment:
      MQTT_DEVICES: ${MQTT_DEVICES:-200}
      LWM2M_DEVICES: ${LWM2M_DEVICES:-20}
      REPORT_INTERVAL: ${REPORT_INTERVAL:-10}
      LWM2M_LIFETIME: ${LWM2M_LIFETIME:-120}
      JITTER: ${JITTER:-true}
      RAMP_PER_SECOND: ${RAMP_PER_SECOND:-50}
      MQTT_HOST: mosquitto
      LWM2M_SERVER: coap://leshan:5683
    depends_on:
      ingest: { condition: service_started }
      lwm2m-bridge: { condition: service_started }

  prometheus:
    build: infra/prometheus
    restart: unless-stopped
    ports: ["9095:9090"]

  grafana:
    build: infra/grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # local only: dashboards without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin-local-only
    ports: ["3001:3000"]

volumes:
  mosquitto-data:
  kafka-data:
  postgres-data:
