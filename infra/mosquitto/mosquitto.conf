# Local development broker. Production: TLS on 8883 with per-device X.509 client certificates,
# topic ACLs (a device may only use devices/<its-id>/#), and a clustered broker (EMQX/HiveMQ)
# behind a TCP load balancer. See docs/scaling.md.
listener 1883
protocol mqtt
allow_anonymous true

# Persistent sessions: queued QoS 1 messages for offline devices survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1d
# Per-client queue for offline/slow clients. Beyond this the broker DROPS QoS 1 messages:
# watch $SYS/broker/publish/messages/dropped. Sized for the ingest consumers to absorb bursts.
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
