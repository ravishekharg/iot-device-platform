# Local broker with authentication and topic ACLs: every client logs in (devices with their device id and a
# per-device secret, the platform services with their own users), and a device may only publish to and read its
# own topics (see acl). Production adds TLS on 8883 with per-device X.509 client certificates and a clustered
# broker (EMQX/HiveMQ) behind a TCP load balancer. See docs/scaling.md.
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistent sessions: queued QoS 1 messages for offline devices survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1d
# Per-client queue for offline/slow clients. Beyond this the broker DROPS QoS 1 messages:
# watch $SYS/broker/publish/messages/dropped. Sized for the ingest consumers to absorb bursts.
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
